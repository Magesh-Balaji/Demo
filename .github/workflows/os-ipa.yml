name: Build Demo MAUI iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: Build Demo iOS
    runs-on: macos-latest

    steps:

      # 1. Get the source code
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Install .NET 8
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # 3. Install MAUI
      - name: Install MAUI workload
        run: |
          dotnet workload install maui

      # 4. Check environment
      - name: Check environment
        run: |
          dotnet --info
          xcodebuild -version

      # 5. Restore your MAUI project
      - name: Restore
        run: |
          dotnet restore Demo/Demo.csproj

      # 6. Build iOS
      - name: Build iOS
        run: |
          dotnet build Demo/Demo.csproj \
            -f net10.0-ios \
            -c Release \
            -r ios-arm64 \
            -p:EnableCodeSigning=false

      # 7. Create IPA
      - name: Publish IPA
        run: |
          dotnet publish Demo/Demo.csproj \
            -f net10.0-ios \
            -c Release \
            -r ios-arm64 \
            -p:ArchiveOnBuild=true \
            -p:BuildIpa=true \
            -p:EnableCodeSigning=false

      # 8. Find IPA
      - name: Find IPA
        run: |
          echo "Searching for IPA..."
          find . -name "*.ipa" -print

      # 9. Upload IPA to GitHub
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Demo-iOS-IPA
          path: "**/*.ipa"
          if-no-files-found: error